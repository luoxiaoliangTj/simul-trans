name: Build Android APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
    timeout-minutes: 55
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show environment and locate spec
        run: |
          echo "HOME=$HOME"
          whoami
          pwd
          ls -la
          find . -maxdepth 3 -name buildozer.spec -print
          buildozer --version || true

      - name: Build pass 1 (download SDK/NDK, may stop at license prompt)
        run: |
          SPEC_DIR="$(dirname "$(find . -maxdepth 3 -name buildozer.spec | head -1)")"
          echo "spec dir: $SPEC_DIR"
          cd "$SPEC_DIR"
          buildozer -v android debug 2>&1 | tee buildozer_pass1.log || true

      - name: Accept all Android SDK licenses
        run: |
          SDK_DIR="/github/home/.buildozer/android/platform/android-sdk"
          if [ -f "$SDK_DIR/tools/bin/sdkmanager" ]; then
            echo "Accepting all SDK licenses ..."
            yes | "$SDK_DIR/tools/bin/sdkmanager" --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true
          fi

      - name: Build pass 2 (actual APK build, licenses accepted)
        run: |
          SPEC_DIR="$(dirname "$(find . -maxdepth 3 -name buildozer.spec | head -1)")"
          echo "spec dir: $SPEC_DIR"
          cd "$SPEC_DIR"
          buildozer -v android debug 2>&1 | tee buildozer_pass2.log

      - name: Upload build logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simul-trans-build-log
          path: |
            **/buildozer_pass1.log
            **/buildozer_pass2.log
          retention-days: 7

      - name: List produced artifacts
        run: |
          SPEC_DIR="$(dirname "$(find . -maxdepth 3 -name buildozer.spec | head -1)")"
          cd "$SPEC_DIR"
          echo "=== bin/ contents ==="
          ls -la bin/ 2>/dev/null || echo "no bin/ dir"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: simul-trans-debug-apk
          path: '**/bin/*.apk'
          retention-days: 7
