name: Build Android APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
    timeout-minutes: 55
    env:
      ANDROID_SDK_ROOT: /root/.buildozer/android/platform/android-sdk
      ANDROID_NDK_ROOT: /root/.buildozer/android/platform/android-ndk-r25b
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show environment and locate spec
        run: |
          echo "HOME=$HOME"
          whoami
          pwd
          ls -la
          find . -maxdepth 3 -name buildozer.spec -print
          buildozer --version || true

      - name: Pre-accept Android SDK licenses
        run: |
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          if [ -f "$SDK_DIR/tools/bin/sdkmanager" ]; then
            echo y | "$SDK_DIR/tools/bin/sdkmanager" --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true
          fi

      - name: Build debug APK with Buildozer
        run: |
          SPEC_DIR="$(dirname "$(find . -maxdepth 3 -name buildozer.spec | head -1)")"
          echo "spec dir: $SPEC_DIR"
          cd "$SPEC_DIR"
          buildozer -v android debug

      - name: List produced artifacts
        run: |
          SPEC_DIR="$(dirname "$(find . -maxdepth 3 -name buildozer.spec | head -1)")"
          cd "$SPEC_DIR"
          ls -la bin/ 2>/dev/null || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: simul-trans-debug-apk
          path: '**/bin/*.apk'
          retention-days: 7
