name: Build Android APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show environment and locate spec
        run: |
          echo "HOME=$HOME"
          whoami
          pwd
          ls -la
          find . -maxdepth 3 -name buildozer.spec -print
          buildozer --version || true

      - name: Build debug APK with Buildozer
        run: |
          SPEC_DIR="$(dirname "$(find . -maxdepth 3 -name buildozer.spec | head -1)")"
          echo "spec dir: $SPEC_DIR"
          cd "$SPEC_DIR"
          buildozer -v android debug

      - name: List produced artifacts
        run: |
          SPEC_DIR="$(dirname "$(find . -maxdepth 3 -name buildozer.spec | head -1)")"
          cd "$SPEC_DIR"
          ls -la bin/ 2>/dev/null || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: simul-trans-debug-apk
          path: '**/bin/*.apk'
          retention-days: 7
